# Company -> ATS / track mapping for the discovery pipeline.
#
# track: A = direct ATS polling (greenhouse/ashby/workday public APIs)
#        B = relies on broad NYC market scrape (LinkedIn via Apify) to surface postings
#            (not assigned per-company here -- Track B is the blanket scrape that
#             catches companies OUTSIDE the tier list; every tier-list company below
#             gets A or C so it has a guaranteed, company-specific check)
#        C = fallback hash-diff monitoring of the careers page (workday_protected/custom)
#
# ats_type: greenhouse | ashby | workday | workday_protected | custom
#
# tenant/site/slug per ats_type:
#   greenhouse -> slug         (boards-api.greenhouse.io/v1/boards/{slug}/jobs,
#                                a few companies are on the EU region: job-boards.eu.greenhouse.io)
#   ashby      -> slug         (api.ashbyhq.com/posting-api/job-board/{slug})
#   workday    -> tenant, site (POST {tenant}.wd{N}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs
#                                -- wdN varies per company, kept in careers_url)
#   workday_protected / custom -> tenant/site/slug null, track must be C
#
# Audited 2026-07-31 via live API verification (3 parallel batches: quant/trading,
# AI/big tech, enterprise/finance/SaaS). Confidence varies per entry -- see `notes`.
# Entries noting only "200 OK on career site" (not a confirmed cxs/jobs POST) should
# be spot-checked before Track A polling code depends on them; greenhouse/ashby
# entries were confirmed against the actual posting-api/boards-api JSON response.
#
# Coverage-matrix check: every company below has a non-null `track`. 89 companies
# total (tier list had 88 unique + 1 intentional duplicate, see VS Code note).

