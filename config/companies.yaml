# Company -> ATS / track mapping for the discovery pipeline.
#
# track: A = direct ATS polling (greenhouse/ashby/workday public APIs)
#        B = relies on broad NYC market scrape (LinkedIn via Apify) to surface postings
#        C = fallback hash-diff monitoring of the careers page (workday_protected/custom)
#
# ats_type: greenhouse | ashby | workday | workday_protected | custom
#
# Fill in tenant/site/slug per ats_type:
#   greenhouse -> slug        (boards-api.greenhouse.io/v1/boards/{slug}/jobs)
#   ashby      -> slug        (jobs.ashbyhq.com/{slug} public board api)
#   workday    -> tenant, site (POST {tenant}.wd{N}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs)
#   workday_protected / custom -> leave tenant/site/slug null, track must be C
#
# Every company below must end up with a non-null `track`. The coverage-matrix
# check (build order step 1) fails loudly if any company is missing one.

companies: []
# Example entry once audited:
# - name: "Example Co"
#   tier: 1
#   track: A
#   ats_type: greenhouse
#   tenant: null
#   site: null
#   slug: examplecowork
#   careers_url: "https://example.com/careers"
#   notes: ""
